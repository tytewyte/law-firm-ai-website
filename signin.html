<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Velocity Leads - Manage your AI-powered intake system" />
    <title>Sign In - Velocity Leads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="top">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="Velocity Leads home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Velocity Leads</span>
        </a>

        <nav class="nav" aria-label="Primary">
          <div class="nav-menu">
            <a class="nav-link" href="index.html">Home</a>
            <a class="button button-primary nav-cta" href="signup.html">Sign Up</a>
          </div>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="auth-section">
        <div class="container">
          <div class="auth-container signin-container">
            <div class="auth-header">
              <h1>Welcome Back</h1>
              <p>Sign in to manage your AI intake system</p>
            </div>

            <form class="auth-form" id="signin-form" name="signin" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="booking.html">
              <input type="hidden" name="form-name" value="signin" />
              <p class="sr-only">
                <label>
                  Don't fill this out if you're human:
                  <input name="bot-field" />
                </label>
              </p>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@lawfirm.com" autocomplete="email" />
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password" />
              </div>

              <div class="form-group checkbox-group">
                <label class="checkbox-label">
                  <input type="checkbox" name="remember" />
                  <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
              </div>

              <button type="submit" class="button button-primary button-full">Sign In</button>

              <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
              </p>
            </form>

            <div class="auth-divider">
              <span>or continue with</span>
            </div>

            <div class="social-auth">
              <button class="social-button google-button">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                  <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18L12.05 13.56c-.806.54-1.836.86-3.047.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9.003 18z" fill="#34A853"/>
                  <path d="M3.964 10.712c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.96H.957C.347 6.175 0 7.55 0 9.002c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                  <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
                </svg>
                Google
              </button>
              <button class="social-button microsoft-button">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <path d="M0 0h8.571v8.571H0V0z" fill="#F25022"/>
                  <path d="M9.429 0H18v8.571H9.429V0z" fill="#7FBA00"/>
                  <path d="M0 9.429h8.571V18H0V9.429z" fill="#00A4EF"/>
                  <path d="M9.429 9.429H18V18H9.429V9.429z" fill="#FFB900"/>
                </svg>
                Microsoft
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-left">
          <div class="footer-brand">Velocity Leads</div>
          <div class="footer-meta">© <span id="year"></span> Velocity Leads. All rights reserved.</div>
        </div>

        <div class="footer-links" aria-label="Footer links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="index.html#pricing">Pricing</a>
          <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </footer>
  </body>
</html>
